<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Progres Magang Labkesmas</title>
<meta name="description" content="Laporan Progres Magang: 1 Bulan Membangun Sistem Digital Labkesmas Banda Aceh, oleh Muhammad Ulul Arhami (Pranata Komputer).">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23050B14'/%3E%3Ctext x='32' y='41' font-family='Arial' font-weight='700' font-size='26' text-anchor='middle' fill='%232DD4BF'%3EUA%3C/text%3E%3C/svg%3E">

<!-- ================= FONT ================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<!-- ================= REVEAL.JS (CSS inti, tanpa tema; tampilan memakai gaya sendiri) ================= -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.css">

<!-- ================= IMPORT MAP (Three.js versi terbaru) ================= -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>

<style>
/* =========================================================
   1. TOKEN WARNA & DASAR
   ========================================================= */
:root{
  --bg:#050B14;
  --teal:#2DD4BF;
  --blue:#60A5FA;
  --gold:#FBBF24;
  --text:#E6EDF3;
  --muted:#8B9BB0;
  --glass:rgba(255,255,255,.04);
  --glass-border:rgba(255,255,255,.10);
  --radius:24px;
  --grad:linear-gradient(120deg,var(--teal) 0%,var(--blue) 100%);
  --grad-gold:linear-gradient(120deg,#FDE68A 0%,var(--gold) 60%,#F59E0B 100%);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Space Grotesk","Plus Jakarta Sans",system-ui,sans-serif;
  --pad-top:5.6rem;
  --pad-bot:5rem;
  --pad-l:6rem;
  --pad-r:7rem;
  color-scheme:dark;
}
/* Ukuran dasar mengikuti layar seperti slide 16:9 (1rem = 1% lebar panggung) */
html{font-size:clamp(10px,min(1vw,1.7778vh),28px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:1rem;line-height:1.5;overflow:hidden;height:100vh;height:100dvh;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul{list-style:none}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:8px}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* =========================================================
   2. LAPISAN LATAR: KANVAS 3D, GRADASI GELAP, GRID HALUS
   ========================================================= */
#bg3d{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.scrim{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(130% 95% at 55% 50%,transparent 35%,rgba(5,11,20,.78) 100%),
    linear-gradient(90deg,rgba(5,11,20,.86) 0%,rgba(5,11,20,.52) 42%,rgba(5,11,20,.18) 72%,rgba(5,11,20,.34) 100%),
    linear-gradient(180deg,rgba(5,11,20,.7) 0%,transparent 16%,transparent 82%,rgba(5,11,20,.8) 100%);
}
.gridlines{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;
  background-image:linear-gradient(rgba(255,255,255,.9) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.9) 1px,transparent 1px);
  background-size:4rem 4rem;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 20%,transparent 75%);
          mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 20%,transparent 75%);
}

/* =========================================================
   3. LOADING SCREEN
   ========================================================= */
#loader{position:fixed;inset:0;z-index:150;display:grid;place-items:center}
.curtain{position:absolute;left:0;right:0;height:50.5%;background:var(--bg)}
.curtain.top{top:0;border-bottom:1px solid rgba(45,212,191,.35);box-shadow:0 1px 40px rgba(45,212,191,.25)}
.curtain.bottom{bottom:0;border-top:1px solid rgba(96,165,250,.35);box-shadow:0 -1px 40px rgba(96,165,250,.2)}
.loader-core{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:1.6rem}
.loader-ring-wrap{position:relative;width:clamp(120px,11rem,200px);aspect-ratio:1}
.loader-ring{width:100%;height:100%;overflow:visible}
.loader-ring circle{fill:none;stroke-width:3}
.lr-track{stroke:rgba(255,255,255,.08)}
.lr-bar{stroke:url(#gTealBlue);stroke-dasharray:339.3;stroke-dashoffset:339.3;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(45,212,191,.8))}
.loader-initials{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--num);font-weight:700;font-size:clamp(36px,3.6rem,64px);letter-spacing:-.02em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.loader-pct{font-family:var(--num);font-size:clamp(14px,1.1rem,20px);color:var(--text);letter-spacing:.1em}
.loader-caption{font-size:clamp(11px,.8rem,15px);color:var(--muted);letter-spacing:.28em;text-transform:uppercase}

/* =========================================================
   4. BINGKAI NAVIGASI (progress bar, header, dots, footer)
   ========================================================= */
.chrome{opacity:0}
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:30;background:rgba(255,255,255,.05)}
.progress span{display:block;height:100%;background:var(--grad);transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 14px rgba(45,212,191,.8)}
.topbar{
  position:fixed;top:1.4rem;left:2.2rem;right:2.2rem;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;pointer-events:none;
}
.brand{
  pointer-events:auto;display:flex;align-items:center;height:2.9rem;padding:.45rem 1rem;border-radius:999px;
  background:rgba(255,255,255,.93);box-shadow:0 8px 30px -10px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.2);
}
.brand img{height:100%;width:auto;display:block}
.counter{display:flex;align-items:center;gap:1rem;font-size:.85rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.counter .sec{max-width:18rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter .num{font-family:var(--num);font-size:1.05rem;letter-spacing:.08em;color:var(--muted)}
.counter .num b{color:var(--text);font-weight:600}
.counter .sep{width:2.2rem;height:1px;background:rgba(255,255,255,.2)}

.dots{position:fixed;right:2.4rem;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:.85rem}
.dots button{position:relative;width:.6rem;height:.6rem;border-radius:999px;background:rgba(255,255,255,.22);transition:height .45s cubic-bezier(.2,.8,.2,1),background .3s,box-shadow .3s}
.dots button::after{content:"";position:absolute;inset:-.6rem}
.dots button:hover{background:rgba(255,255,255,.6)}
.dots button.is-active{height:2rem;background:var(--teal);box-shadow:0 0 14px rgba(45,212,191,.8)}
.dots .dot-label{
  position:absolute;right:1.6rem;top:50%;transform:translate(6px,-50%);white-space:nowrap;
  font-size:.8rem;font-weight:600;color:var(--text);padding:.35rem .75rem;border-radius:999px;
  background:rgba(5,11,20,.85);border:1px solid var(--glass-border);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
}
.dots button:hover .dot-label,.dots button:focus-visible .dot-label{opacity:1;transform:translate(0,-50%)}

.bottombar{
  position:fixed;left:2.2rem;right:2.2rem;bottom:1.4rem;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;pointer-events:none;
}
.bottombar > *{pointer-events:auto}
.presenter-mini{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:.7rem}
.presenter-mini i{width:.45rem;height:.45rem;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
.controls{display:flex;align-items:center;gap:.6rem}
.nav-btn{
  width:2.9rem;height:2.9rem;border-radius:50%;display:grid;place-items:center;font-size:1.15rem;
  background:rgba(255,255,255,.05);border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:background .25s,border-color .25s,transform .25s,opacity .25s;
}
.nav-btn:hover{background:rgba(45,212,191,.14);border-color:rgba(45,212,191,.5)}
.nav-btn:active{transform:scale(.94)}
.nav-btn:disabled{opacity:.3;pointer-events:none}
.key-hint{font-size:.78rem;color:var(--muted);margin-right:.4rem;display:flex;align-items:center;gap:.4rem}
.key-hint kbd{font-family:var(--num);font-size:.72rem;padding:.15rem .45rem;border-radius:6px;border:1px solid var(--glass-border);background:rgba(255,255,255,.04);color:var(--text)}

/* =========================================================
   5. KERANGKA SLIDE
   ========================================================= */
/* Reveal.js mengatur slide mana yang tampil; ukuran & tata letak tetap memakai CSS ini */
body.reveal-viewport{background:var(--bg);color:var(--text);line-height:1.5}
#deck{position:fixed;inset:0;z-index:5;width:auto;height:auto}
.reveal .slides{text-align:left;perspective:1400px;perspective-origin:50% 50%}
.reveal .slides > section.slide{
  position:absolute;inset:0;width:100%;height:100%;flex-direction:column;
  padding:var(--pad-top) var(--pad-r) var(--pad-bot) var(--pad-l);
  overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent;
  perspective:none;
}
.reveal .slides > section.slide:not(.present){pointer-events:none}
.reveal aside.notes{display:none}
.reveal .pause-overlay{background:var(--bg)}
/* Poin bertahap (fragment Reveal) */
.reveal .slides section .list li.fragment.fade-up{transform:translateY(12px)}
.reveal .slides section .list li.fragment.fade-up.visible{transform:none}
.stage{position:relative;width:100%;max-width:90rem;margin:auto}
.stage-col{display:flex;flex-direction:column;gap:2rem}
.split-2{display:grid;grid-template-columns:minmax(0,40fr) minmax(0,48fr);gap:3.4rem;align-items:center}
.col{display:flex;flex-direction:column;gap:1.15rem;min-width:0}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:2.5rem}
.head-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1rem;max-width:62rem}
.head-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:.9rem}
.grid-proj{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:1.3rem}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.3rem}
.grid-5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1rem}
.card-in{display:flex;min-width:0}
.card-in > .glass{flex:1;min-width:0}

/* =========================================================
   6. TIPOGRAFI
   ========================================================= */
.kicker{display:inline-flex;align-items:center;gap:.8rem;font-size:.9rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--teal)}
.kicker::before{content:"";width:2.2rem;height:1px;background:var(--grad);box-shadow:0 0 8px var(--teal)}
.k-row{display:flex;align-items:center;flex-wrap:wrap;gap:1rem}
.h-hero{font-size:6.2rem;font-weight:800;line-height:1;letter-spacing:-.04em;text-shadow:0 4px 40px rgba(5,11,20,.7)}
.h-title{font-size:3.7rem;font-weight:800;line-height:1.05;letter-spacing:-.032em;text-shadow:0 4px 30px rgba(5,11,20,.7)}
.spj .h-title{font-size:3.3rem}
.oto .h-title{font-size:3rem}
.lead{font-size:1.5rem;line-height:1.45;color:#C9D4E0;max-width:50rem}
.num-xl{
  font-family:var(--num);font-weight:700;font-size:clamp(64px,7.4rem,140px);line-height:.9;letter-spacing:-.045em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 28px rgba(45,212,191,.25));font-variant-numeric:tabular-nums;
}
/* Split text: huruf per huruf */
[data-split] .w{display:inline-block;overflow:hidden;vertical-align:top;padding:.08em .03em .14em;margin:-.08em -.03em -.14em}
[data-split] .c{display:inline-block;will-change:transform}

/* Kotak "Ini apa?" */
.what{position:relative;padding:.2rem 0 .2rem 1.2rem;max-width:48rem}
.what::before{content:"";position:absolute;left:0;top:.2rem;bottom:.2rem;width:3px;border-radius:3px;background:var(--grad);box-shadow:0 0 12px rgba(45,212,191,.6)}
.what-label{display:block;font-size:.78rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:.25rem}
.what p{font-size:1.2rem;line-height:1.5;color:#D5DEE8}

/* Blok persentase besar */
.pct{display:flex;align-items:center;gap:1.4rem}
.pct-meta{display:flex;flex-direction:column;gap:.6rem;width:10rem}
.pct-label{font-size:.8rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.bar{height:.45rem;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:inherit;box-shadow:0 0 12px rgba(45,212,191,.7)}

/* =========================================================
   7. KARTU GLASS + TILT + SPOTLIGHT
   ========================================================= */
.glass{
  position:relative;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);
  -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 50px -25px rgba(0,0,0,.8);
  overflow:hidden;transform-style:preserve-3d;
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(24rem circle at var(--mx,50%) var(--my,50%),rgba(45,212,191,.14),transparent 45%);
}
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;opacity:0;transition:opacity .4s;
  background:radial-gradient(16rem circle at var(--mx,50%) var(--my,50%),rgba(45,212,191,.7),transparent 50%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
}
.glass:hover::before,.glass:hover::after{opacity:1}
.lite .glass{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);background:rgba(10,20,34,.6)}
/* Saat slide berputar 3D, blur kaca dimatikan sementara agar ringan */
.is-turning .glass,.is-turning .nav-btn{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(12,22,38,.82)}

/* Badge status */
.badge{
  display:inline-flex;align-items:center;gap:.5em;padding:.38em .9em;border-radius:999px;white-space:nowrap;
  font-size:.8rem;font-weight:700;letter-spacing:.02em;border:1px solid;line-height:1.2;
}
.badge::before{content:"";width:.5em;height:.5em;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.badge.teal{color:var(--teal);background:rgba(45,212,191,.1);border-color:rgba(45,212,191,.38)}
.badge.blue{color:var(--blue);background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.38)}
.badge.gold{color:var(--gold);background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.38)}
.badge.sm{font-size:.72rem}

/* Daftar poin */
.card-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.4rem}
.card-head h3{display:flex;align-items:center;gap:.6rem;font-size:.85rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.card-head h3 .ic{font-size:1.1rem;color:var(--teal)}
.list-card.sisa .card-head h3 .ic{color:var(--gold)}
.pill-count{font-family:var(--num);font-size:.85rem;padding:.2rem .7rem;border-radius:999px;background:rgba(255,255,255,.06);color:var(--text)}
.list li{display:grid;grid-template-columns:1.6rem 1fr;gap:.75rem;align-items:start;padding:.55rem 0;font-size:1.02rem;line-height:1.45;border-bottom:1px solid rgba(255,255,255,.06)}
.list li:last-child{border-bottom:0}
.list li .ic{width:1.6rem;height:1.6rem;padding:.3rem;border-radius:50%;margin-top:-.05rem;stroke-width:2.4}
.list.done li .ic{color:var(--teal);background:rgba(45,212,191,.12)}
.list.sisa li .ic{color:var(--gold);background:rgba(251,191,36,.12)}
.list-card{padding:1.4rem 1.6rem}

/* Progress ring */
.ring-wrap{position:relative;width:8.4rem;aspect-ratio:1}
.ring{width:100%;height:100%;overflow:visible}
.ring circle{fill:none;stroke-width:7}
.ring-track{stroke:rgba(255,255,255,.07)}
.ring-bar{stroke:url(#gTealBlue);stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(45,212,191,.75))}
.ring-label{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:2rem;letter-spacing:-.03em}

/* Tombol utama */
.btn-primary{
  display:inline-flex;align-items:center;gap:.8rem;padding:1.05rem 1.8rem;border-radius:999px;
  font-size:1.1rem;font-weight:700;color:#04121A;background:var(--grad);
  box-shadow:0 12px 40px -10px rgba(45,212,191,.75),inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;
}
.btn-primary .ic{font-size:1.25rem;transition:transform .3s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 50px -10px rgba(45,212,191,.9),inset 0 1px 0 rgba(255,255,255,.4)}
.btn-primary:hover .ic{transform:translateX(4px)}

/* =========================================================
   8. SLIDE PEMBUKA
   ========================================================= */
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:1.7rem;max-width:56rem}
.presenter{display:flex;align-items:center;gap:1.2rem;padding:1rem 1.6rem 1rem 1rem;border-radius:20px}
.avatar{
  width:3.8rem;height:3.8rem;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;
  background:radial-gradient(circle at 30% 30%,rgba(45,212,191,.35),rgba(96,165,250,.12));border:1px solid rgba(45,212,191,.45);
  font-family:var(--num);font-weight:700;font-size:1.3rem;color:var(--text);box-shadow:0 0 24px rgba(45,212,191,.35);
}
.who{display:flex;flex-direction:column;gap:.1rem}
.who strong{font-size:1.3rem;font-weight:700}
.who span{font-size:.98rem;color:var(--muted)}
.hero-actions{display:flex;align-items:center;flex-wrap:wrap;gap:1.4rem;margin-top:.3rem}
.hint{display:flex;align-items:center;gap:.6rem;font-size:.9rem;color:var(--muted)}
.hint .ic{font-size:1.2rem}

/* =========================================================
   9. SLIDE RINGKASAN
   ========================================================= */
.s-head{display:flex;flex-direction:column;gap:1rem}
.proj-card{display:flex;flex-direction:column;align-items:flex-start;gap:1.1rem;padding:1.6rem;height:100%}
.card-in[data-goto]{cursor:pointer}
.pc-body{display:flex;flex-direction:column;align-items:flex-start;gap:.6rem;flex:1}
.pc-no{font-family:var(--num);font-size:.85rem;color:var(--muted);letter-spacing:.14em}
.pc-name{font-size:1.25rem;font-weight:700;line-height:1.3}
.pc-link{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;font-weight:600;color:var(--muted);transition:color .25s,gap .25s}
.card-in[data-goto]:hover .pc-link{color:var(--teal);gap:.7rem}
.stats-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.3rem}
.stat{border-top:1px solid rgba(255,255,255,.12);padding-top:1.1rem;position:relative}
.stat::before{content:"";position:absolute;top:-1px;left:0;width:2.6rem;height:2px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.stat-num{
  font-family:var(--num);font-weight:700;font-size:3.5rem;line-height:1;letter-spacing:-.04em;
  background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;color:transparent;
  display:flex;align-items:baseline;gap:.35rem;
}
.stat-num small{font-size:1.2rem;letter-spacing:0;font-weight:600}
.stat p{margin-top:.55rem;font-size:1rem;color:var(--muted);line-height:1.4}

/* =========================================================
   10. SLIDE PORTAL
   ========================================================= */
.mini-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.mini{display:flex;flex-direction:column;padding:.8rem 1rem;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08)}
.mini strong{font-family:var(--num);font-size:1.9rem;line-height:1.1;color:var(--gold);font-weight:700;letter-spacing:-.03em}
.mini > span{font-size:.9rem;color:var(--muted)}
.col-cards{gap:1.2rem}

/* =========================================================
   11. SLIDE OTOMASI SPREADSHEET & REKAP (diagram alur 3 tahap)
   ========================================================= */
.oto{gap:1.3rem}
.flow{position:relative;display:grid;grid-template-columns:14.5rem minmax(2.5rem,1fr) 30rem minmax(2.5rem,1fr) 29rem;align-items:center}
.flow-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;opacity:0;filter:drop-shadow(0 0 6px rgba(45,212,191,.8))}
.fl-base{fill:none;stroke:rgba(96,165,250,.25);stroke-width:1.5}
.fl-glow{fill:none;stroke:var(--teal);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:70 330;animation:flowDash 2.6s linear infinite}
.fl-glow.out{stroke:var(--blue)}
.fl-dot{fill:#E6FFFB}
@keyframes flowDash{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
.flow-src{grid-column:1;position:relative;z-index:1}
.flow-dst{grid-column:3;display:grid;gap:.7rem;position:relative;z-index:1}
.flow-out{grid-column:5;position:relative;z-index:1}
.src-card{display:flex;flex-direction:column;align-items:flex-start;gap:.45rem;padding:1.3rem}
.src-icon{position:relative;width:3.2rem;height:3.2rem;border-radius:15px;display:grid;place-items:center;font-size:1.6rem;color:#04121A;background:var(--grad);box-shadow:0 0 30px rgba(45,212,191,.55);margin-bottom:.3rem}
.src-icon .pulse{position:absolute;inset:-6px;border-radius:19px;border:1px solid rgba(45,212,191,.7);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.5);opacity:0}}
.src-card strong{font-size:1.2rem;line-height:1.2}
.src-card > span{font-size:.88rem;color:var(--muted)}
.src-pill{display:inline-flex;align-items:center;gap:.5rem;margin-top:.3rem;padding:.3rem .75rem;border-radius:999px;font-size:.78rem;font-weight:700;color:var(--gold);background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35)}
.src-pill i{width:.45rem;height:.45rem;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.dst-card{display:grid;grid-template-columns:2.4rem 1fr;gap:.85rem;padding:.85rem 1.1rem;align-items:start}
.dst-icon{width:2.4rem;height:2.4rem;border-radius:12px;display:grid;place-items:center;font-size:1.15rem;color:var(--teal);background:rgba(45,212,191,.1);border:1px solid rgba(45,212,191,.3)}
.dst-body{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.dst-top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.dst-top strong{font-size:1.02rem}
.dst-body p{font-size:.84rem;line-height:1.42;color:#C3CEDA}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chip{font-size:.7rem;font-weight:600;padding:.16rem .55rem;border-radius:999px;color:#BFDBFE;background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.3)}
.out-card{padding:1.1rem 1.3rem;display:flex;flex-direction:column;gap:.55rem;border-color:rgba(96,165,250,.3)}
.out-head{display:flex;align-items:center;gap:.8rem}
.out-head strong{display:block;font-size:1.08rem;line-height:1.25}
.out-head > div span{font-size:.8rem;color:var(--muted)}
.rc-icon{width:2.4rem;height:2.4rem;flex:none;border-radius:12px;display:grid;place-items:center;font-size:1.15rem;color:#04121A;background:var(--grad);box-shadow:0 0 22px rgba(96,165,250,.45)}
.out-sec{padding-top:.55rem;border-top:1px solid rgba(255,255,255,.08)}
.out-top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.1rem}
.out-top h4{font-size:.95rem;font-weight:700}
.out-card .list li{grid-template-columns:1.25rem 1fr;gap:.55rem;padding:.26rem 0;font-size:.84rem;line-height:1.4;border-bottom:0}
.out-card .list li .ic{width:1.25rem;height:1.25rem;padding:.22rem}
.oto-bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:1.3rem;align-items:center}
.benefits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem 1rem}
.benefit{display:flex;align-items:center;gap:.75rem;font-size:.92rem;font-weight:600;line-height:1.35}
.b-icon{width:2.3rem;height:2.3rem;flex:none;border-radius:50%;display:grid;place-items:center;font-size:1.05rem;color:var(--teal);background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.4);box-shadow:0 0 20px -4px rgba(45,212,191,.5)}
.highlight{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:1.6rem;align-items:center;padding:1rem 1.4rem;border-color:rgba(251,191,36,.28);background:linear-gradient(120deg,rgba(251,191,36,.06),rgba(255,255,255,.03))}
.hl-label{display:inline-flex;align-items:center;gap:.5rem;font-size:.74rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:.3rem}
.hl-label .ic{font-size:1rem}
.hl-text p{font-size:.86rem;line-height:1.45;color:#D5DEE8}
.hl-viz{display:flex;flex-direction:column;gap:.7rem}
.hl-nums{display:flex;align-items:flex-end;gap:1rem}
.hl-nums > div{display:flex;flex-direction:column}
.hl-k{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hl-nums strong{font-family:var(--num);font-size:2.1rem;line-height:1;letter-spacing:-.04em}
.c-now{color:var(--teal)}
.c-gold{color:var(--gold);text-shadow:0 0 24px rgba(251,191,36,.5)}
.hl-arrow{font-size:1.3rem;color:var(--muted);margin-bottom:.3rem}
.hl-bar{position:relative;height:.85rem;border-radius:99px;background:rgba(255,255,255,.07)}
.hl-bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:inherit}
.hl-proj{background:repeating-linear-gradient(45deg,rgba(251,191,36,.75) 0 7px,rgba(251,191,36,.45) 7px 14px);box-shadow:0 0 22px rgba(251,191,36,.6);animation:goldGlow 2s ease-in-out infinite}
.hl-now{background:linear-gradient(90deg,var(--teal),#99F6E4);box-shadow:0 0 16px rgba(45,212,191,.7)}
@keyframes goldGlow{50%{box-shadow:0 0 34px rgba(251,191,36,.9)}}

/* =========================================================
   12. SLIDE APLIKASI SPJ (timeline)
   ========================================================= */
.tl{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tl-track{position:absolute;left:12.5%;right:12.5%;top:2.2rem;height:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 8px,transparent 8px 14px)}
.tl-fill{position:absolute;left:0;top:0;height:100%;width:0;background:var(--grad);box-shadow:0 0 12px var(--teal)}
.tl-fill::after{content:"";position:absolute;right:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 14px var(--blue);animation:blink 1.4s ease-in-out infinite}
.tl-step{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.35rem}
.tl-node{width:4.4rem;height:4.4rem;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;margin-bottom:.4rem;color:var(--muted);background:rgba(10,18,30,.9);border:1px dashed rgba(255,255,255,.28)}
.tl-step.done .tl-node{color:#04121A;background:var(--grad);border:0;box-shadow:0 0 0 6px rgba(45,212,191,.12),0 0 34px rgba(45,212,191,.6)}
.tl-step strong{font-size:1.15rem}
.tl-an{font-size:.92rem;color:var(--muted)}
.tl-st{margin-top:.25rem;font-size:.72rem;font-weight:800;letter-spacing:.2em;padding:.25rem .7rem;border-radius:999px;color:var(--muted);border:1px solid rgba(255,255,255,.18)}
.tl-step.done .tl-st{color:var(--teal);border-color:rgba(45,212,191,.45);background:rgba(45,212,191,.1)}
.design-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.design-head h3{font-size:.9rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.tl-caption{display:inline-flex;align-items:center;gap:.5rem;font-size:.88rem;color:var(--gold)}
.design-card{position:relative;display:flex;flex-direction:column;gap:.55rem;padding:1.3rem 1.2rem 1.4rem}
.d-icon{width:2.6rem;height:2.6rem;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;color:var(--blue);background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.3);margin-bottom:.2rem}
.design-card strong{font-size:1.02rem;line-height:1.3}
.design-card p{font-size:.88rem;line-height:1.45;color:#B8C4D2}
.d-check{position:absolute;top:1rem;right:1rem;width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;font-size:.85rem;color:#04121A;background:var(--teal);box-shadow:0 0 12px rgba(45,212,191,.7)}
.d-check .ic{stroke-width:3}

/* =========================================================
   13. SLIDE TARGET & PENUTUP
   ========================================================= */
.plan{gap:1.7rem}
.legend{display:flex;gap:1.4rem;font-size:.88rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:.5rem}
.legend i{width:1.6rem;height:.5rem;border-radius:9px}
.lg-now{background:var(--grad);box-shadow:0 0 10px rgba(45,212,191,.6)}
.lg-tgt{background:var(--gold);box-shadow:0 0 12px rgba(251,191,36,.8)}
.plan-grid{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:1.3rem}
.plan-card{padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:.8rem}
.pl-top{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.plan-grid[style*="--n:3"] .pl-top{flex-direction:column;align-items:flex-start;gap:.3rem}
.pl-top h3{font-size:1.2rem;font-weight:700}
.pl-nums{display:flex;align-items:baseline;gap:.5rem;font-family:var(--num);font-weight:700;font-size:1.75rem;letter-spacing:-.03em;white-space:nowrap}
.pl-nums .arr{font-size:1.2rem;color:var(--muted)}
.n-now{color:var(--teal)}
.n-tgt{color:var(--gold);text-shadow:0 0 18px rgba(251,191,36,.55)}
.dbar{position:relative;height:.85rem;border-radius:99px;background:rgba(255,255,255,.07)}
.dbar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:inherit}
.dbar .tgt{background:linear-gradient(90deg,rgba(251,191,36,.35),var(--gold));animation:goldGlow 2.2s ease-in-out infinite;box-shadow:0 0 18px rgba(251,191,36,.6)}
.dbar .now{background:linear-gradient(90deg,var(--teal),#A5F3FC);box-shadow:0 0 14px rgba(45,212,191,.8)}
.plan-card p{font-size:.93rem;line-height:1.45;color:#C3CEDA}
.plan-card p b{color:var(--gold)}
.closing{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.5rem;margin-top:.3rem}
.thanks{font-size:5rem;font-weight:800;letter-spacing:-.04em;line-height:1.05}
.closing p{font-size:1rem;color:var(--muted);letter-spacing:.04em}
.closing p span{color:rgba(255,255,255,.25);margin:0 .5rem}

/* =========================================================
   14. KURSOR CUSTOM
   ========================================================= */
.cursor-dot,.cursor-ring{position:fixed;left:0;top:0;z-index:300;pointer-events:none;border-radius:50%;opacity:0;transition:opacity .3s}
.cursor-dot{width:7px;height:7px;background:var(--teal);box-shadow:0 0 12px var(--teal)}
.cursor-ring{width:38px;height:38px;border:1px solid rgba(45,212,191,.6);transition:opacity .3s,width .3s,height .3s,background .3s,border-color .3s}
.cursor-ring.is-hover{width:62px;height:62px;background:rgba(45,212,191,.08);border-color:rgba(45,212,191,.9)}
.cursor-ring.is-down{width:30px;height:30px}
.has-cursor.cursor-on .cursor-dot,.has-cursor.cursor-on .cursor-ring{opacity:1}
.has-cursor,.has-cursor *{cursor:none !important}

/* =========================================================
   15. RESPONSIF: HP & TABLET (kartu disusun vertikal, slide bisa di-scroll)
   ========================================================= */
@media (max-width:1100px),(max-aspect-ratio:5/4){
  html{font-size:clamp(14px,3.9vw,16px)}
  :root{--pad-top:5.2rem;--pad-bot:6.5rem;--pad-l:1.1rem;--pad-r:1.1rem}
  .slide{-webkit-overflow-scrolling:touch}
  .stage{margin:0 auto auto}
  .stage-col{gap:1.5rem}
  .split-2,.grid-2,.grid-proj,.grid-5,.stats-4,.highlight,.oto-bottom,.plan-grid{grid-template-columns:1fr}
  .stats-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split-2{gap:1.6rem}
  .head-row{flex-direction:column;align-items:flex-start;gap:1.2rem}
  .head-side{align-items:flex-start;width:100%}
  .h-hero{font-size:clamp(2.4rem,11vw,3.6rem)}
  .h-title,.oto .h-title,.spj .h-title{font-size:clamp(1.9rem,8vw,2.6rem)}
  .lead{font-size:1.15rem}
  .what p{font-size:1.02rem}
  .num-xl{font-size:clamp(64px,20vw,110px)}
  .topbar{top:.9rem;left:1rem;right:1rem}
  .brand{height:2.5rem;padding:.4rem .8rem}
  .counter .sec,.counter .sep{display:none}
  .dots{display:none}
  .bottombar{left:1rem;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom));justify-content:center}
  .presenter-mini,.key-hint{display:none}
  .nav-btn{width:3rem;height:3rem}
  .progress{height:3px}
  #deck::before,#deck::after{content:"";position:fixed;left:0;right:0;height:5rem;z-index:6;pointer-events:none}
  #deck::before{top:0;background:linear-gradient(180deg,var(--bg) 20%,transparent)}
  #deck::after{bottom:0;background:linear-gradient(0deg,var(--bg) 25%,transparent)}
  .ring-wrap{width:6.2rem}
  .ring-label{font-size:1.5rem}
  .proj-card{padding:1.1rem;gap:1rem;flex-direction:row;align-items:center;flex-wrap:wrap}
  .pc-body{min-width:0}
  .pc-link{width:100%}
  .pc-name{font-size:1rem}
  .stat-num{font-size:2.4rem}
  .mini-stats{gap:.6rem}
  .mini strong{font-size:1.4rem}
  .flow{grid-template-columns:1fr;gap:1.2rem}
  .flow-src,.flow-dst,.flow-out{grid-column:1}
  .flow-svg{display:none}
  .flow-dst,.flow-out{padding-left:1.1rem;border-left:2px solid rgba(45,212,191,.45)}
  .flow-out{border-left-color:rgba(96,165,250,.5)}
  .highlight{gap:1.2rem;padding:1.2rem}
  .tl{grid-template-columns:1fr;gap:1rem}
  .tl-track{left:2.2rem;right:auto;top:2.2rem;bottom:2.2rem;width:2px;height:auto;background:repeating-linear-gradient(180deg,rgba(255,255,255,.18) 0 8px,transparent 8px 14px)}
  .tl-fill{width:100% !important;height:12%}
  .tl-fill::after{display:none}
  .tl-step{display:grid;grid-template-columns:4.4rem 1fr;grid-template-rows:auto auto auto;column-gap:1rem;text-align:left;align-items:center;justify-items:start}
  .tl-node{grid-row:1 / span 3;margin:0}
  .plan-card{padding:1.1rem}
  .pl-top{flex-direction:column;gap:.3rem}
  .thanks{font-size:clamp(2.6rem,12vw,3.6rem)}
  .closing p span{display:block;height:0;overflow:hidden}
}

/* Pratinjau di jendela catatan pembicara: sembunyikan tombol & kursor */
html.is-receiver .bottombar,html.is-receiver .dots,html.is-receiver .cursor-dot,html.is-receiver .cursor-ring{display:none}

/* Mode gerak dikurangi: nonaktifkan animasi CSS berulang */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>

<!-- Gradasi SVG bersama (dipakai progress ring & loader) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gTealBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
</svg>

<!-- ================= LATAR 3D ================= -->
<canvas id="bg3d" aria-hidden="true"></canvas>
<div class="scrim" aria-hidden="true"></div>
<div class="gridlines" aria-hidden="true"></div>

<!-- ================= LOADING SCREEN ================= -->

  <div class="curtain top"></div>
  <div class="curtain bottom"></div>

    <div class="loader-ring-wrap">
      <svg class="loader-ring" viewBox="0 0 120 120">
        <circle class="lr-track" cx="60" cy="60" r="54"/>
        <circle class="lr-bar" cx="60" cy="60" r="54" transform="rotate(-90 60 60)"/>
      </svg>
      <div class="loader-initials" id="loaderInitials">UA</div>
    </div>
    <div class="loader-pct"><span id="loaderPct">0</span>%</div>
    <div class="loader-caption">Menyiapkan presentasi</div>
  </div>
</div>

<!-- ================= BINGKAI NAVIGASI ================= -->
